name: Build unsigned IPA

# 没有 Mac 也能出包：在 GitHub 的 macOS 运行器上编译，产物是未签名的 .ipa，
# 下载后用 Sideloadly / AltStore / TrollStore / 全能签 等按自己的方式签名安装。
#
# App/BundledIdentity 里的配件身份文件不进仓库（上游 .gitignore 也排除），
# 这里按上游的做法从公开的 v1.0.4 发布包里取，保证编出来的 App 与 1.0.4 一样
# 带有 CarPlay 所需的身份材料。
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fetch accessory identity from the public 1.0.4 release
        run: |
          set -euo pipefail
          mkdir -p App/BundledIdentity
          work="$(mktemp -d)"
          curl -fsSL -o "$work/1.0.4.ipa" \
            "https://github.com/xmz28/CarWithin/releases/download/v1.0.4/CarWithin-1.0.4-unsigned.ipa"
          unzip -q "$work/1.0.4.ipa" -d "$work/unpacked"
          APP="$(find "$work/unpacked/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          for name in certificate.p7b leaf.cer private.x963; do
            cp "$APP/$name" "App/BundledIdentity/$name"
          done
          ls -l App/BundledIdentity

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          APP="$(find "$PRODUCTS" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          echo "app: $APP"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          echo "version: $VERSION"
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry "CarWithin-$VERSION-unsigned.ipa" Payload
          ls -lh "CarWithin-$VERSION-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-unsigned-ipa
          path: build/ipa/*.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            ${{ runner.temp }}/DerivedData/Logs/**
          if-no-files-found: ignore
