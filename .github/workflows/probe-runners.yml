name: probe-runners

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      matrix:
        os: [macos-13, macos-14, macos-15, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Say hello
        run: |
          xcodebuild -version
          echo "runner=${{ matrix.os }} ok"
